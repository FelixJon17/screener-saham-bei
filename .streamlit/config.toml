# Palet: navy #091540 · royal #1B2CC1 · periwinkle #7692FF · sky #ABD2FA
# [theme] berisi opsi bersama; [theme.light] dan [theme.dark] berisi warna
# tiap mode. Mode dipilih lewat tombol tema di sidebar (src/theme.py).
[theme]
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
baseFontSize = 14
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
headingFontWeights = [800, 700, 700, 700, 600, 600]

[theme.light]
primaryColor = "#1B2CC1"
backgroundColor = "#F3F6FC"
secondaryBackgroundColor = "#E9F0FC"
textColor = "#0E1A45"
borderColor = "#D5E1F5"
linkColor = "#1B2CC1"
chartCategoricalColors = ["#1B2CC1", "#7692FF", "#091540", "#ABD2FA", "#12A150", "#E08A00", "#E0323C"]

[theme.light.sidebar]
backgroundColor = "#091540"
secondaryBackgroundColor = "#13246A"
textColor = "#D6E3FB"
borderColor = "#1C2C78"
primaryColor = "#7692FF"

[theme.dark]
primaryColor = "#7692FF"
backgroundColor = "#070D26"
secondaryBackgroundColor = "#111C45"
textColor = "#E3EBFC"
borderColor = "#1F2C63"
linkColor = "#ABD2FA"
chartCategoricalColors = ["#7692FF", "#ABD2FA", "#4E63E6", "#D6E3FB", "#2BC46D", "#F2A626", "#F0525B"]

[theme.dark.sidebar]
backgroundColor = "#040920"
secondaryBackgroundColor = "#0E1940"
textColor = "#D6E3FB"
borderColor = "#16224F"
primaryColor = "#7692FF"

[server]
headless = true
runOnSave = true
maxUploadSize = 50

[client]
toolbarMode = "minimal"
